<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holdfast · Your little island</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%2351cf66' stroke='%23237a35' stroke-width='8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:Sora,system-ui,sans-serif;--brass:#c9a45c;--bone:#e8e2d4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--bone);background:radial-gradient(120% 90% at 50% 0,#16232f,#070b10);padding:env(safe-area-inset-top) 0 0;overflow-x:hidden;user-select:none}
button,input{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:var(--brass);box-shadow:inset 0 0 0 .13em #8a6d3b;vertical-align:-.14em}
.star{display:inline-block;width:1em;height:1em;background:#f2d9a0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.wrap{max-width:960px;margin:0 auto;padding:10px 10px 140px}
.top{display:flex;align-items:center;gap:8px;min-height:48px;flex-wrap:wrap}
.pill{background:rgba(10,16,24,.72);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 14px;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.pill.big{border-color:rgba(201,164,92,.7);font-size:20px}
.pill .coin,.pill .star{font-size:16px}
.pill.balance{padding:4px 4px 4px 10px;min-height:48px;gap:6px;white-space:nowrap}
.balance-action{flex:none;display:grid;place-items:center;width:38px;height:38px;padding:0;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:var(--bone)}
.balance-action.add{background:var(--brass);color:#1a1307}
.balance-action:hover{box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.balance-action:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.balance-action:active{transform:scale(.95)}
.day{font-size:12px;font-weight:600;color:#9db8a6}
.sp{flex:1}
.link{background:none;border:0;text-decoration:underline;opacity:.7;font-size:13px;color:inherit}
.chip{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:#6d2b2b;font-size:14px}
canvas{display:block;width:100%;aspect-ratio:800/560;border-radius:14px;margin-top:8px;border:1px solid rgba(255,255,255,.1);box-shadow:0 16px 48px rgba(0,0,0,.55)}
.b{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--bone);color:#10161d;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.b:active{transform:scale(.97)}
.b.g{background:var(--brass);color:#1a1307}
.b:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.35);cursor:not-allowed}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.bottom>*{pointer-events:auto}
#sel{width:100%;max-width:560px;background:rgba(10,16,24,.9);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#sel .t{flex:1;min-width:150px;line-height:1.4}#sel small{opacity:.7}
.msg{font-weight:600;font-size:13px;background:rgba(10,16,24,.9);border:1px solid rgba(201,164,92,.5);padding:8px 16px;border-radius:10px;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.6}}
.auth{max-width:360px;margin:12vh auto 0;padding:0 20px;text-align:center}
.auth svg{display:block;margin:0 auto}
.auth h1{font-size:clamp(28px,7vw,38px);margin:14px 0 6px;font-weight:600;letter-spacing:.5px}
.auth p{opacity:.75;font-size:14px;line-height:1.6}
.auth .b{width:100%;margin-top:12px;font-size:15px;padding:14px}
.auth .alt{background:rgba(255,255,255,.08);color:var(--bone);border:1px solid rgba(255,255,255,.18)}
.err{color:#e8a5a5;font-size:13px;min-height:20px}
dialog{border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:20px;width:min(420px,94vw);background:#111922;color:var(--bone);font-family:inherit;box-shadow:0 24px 64px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(3,6,10,.72)}
dialog h2{margin:0 0 6px;text-align:center;font-size:18px;font-weight:600}
.sub{opacity:.75;font-size:13px;line-height:1.6;text-align:center;margin:6px 0}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.amts .b{flex-direction:column;gap:0}.amts small{font-size:11px;font-weight:600;opacity:.65}
.row{display:flex;justify-content:space-between;margin-top:14px}
input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:11px;font-weight:600}
.opt{display:flex;gap:10px;align-items:center;margin-top:10px;background:rgba(255,255,255,.04);padding:8px 10px;border-radius:12px}
.opt canvas{width:96px;height:80px;margin:0;border:0;border-radius:10px;box-shadow:none;background:radial-gradient(#3d5a4a,#2a4034);aspect-ratio:auto;flex:none}
.opt div{flex:1;font-size:12px;line-height:1.5;opacity:.9}.opt b{font-size:14px;font-weight:600}
.opt .b{padding:9px 12px;font-size:14px}
.rw{font-size:30px;font-weight:600;text-align:center;margin:10px 0;color:#f2d9a0}
.gift{text-align:center;cursor:pointer;margin:10px 0;animation:breathe 1.8s ease-in-out infinite}
.pa{position:fixed;pointer-events:none;z-index:99;font-size:16px;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.4);opacity:0}}
.pop{position:fixed;pointer-events:none;z-index:100;font-weight:600;font-size:22px;color:#f2d9a0;text-shadow:0 2px 10px #000;animation:rise 1.1s ease-out forwards}
@keyframes rise{from{transform:translate(-50%,0)}to{transform:translate(-50%,-80px);opacity:0}}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--bone);color:#10161d;font-weight:600;padding:10px 16px;border-radius:10px;z-index:200;transition:opacity .3s;opacity:0;pointer-events:none;font-size:13px;max-width:92vw;text-align:center}
.x{position:absolute;z-index:2;top:14px;right:16px;background:rgba(255,255,255,.08);border:0;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;opacity:.8;padding:0}
.sup{text-align:center;font-size:14px;font-weight:600;opacity:.6;margin-top:2px}
.ap{display:flex;justify-content:center;align-items:baseline;gap:2px;margin:18px 0 26px;font-size:clamp(44px,17vw,68px);font-weight:600;letter-spacing:-2px}
.ap span{opacity:.4}
.ap input{flex:none;background:none;border:0;border-radius:0;padding:0;font-size:inherit;font-weight:inherit;letter-spacing:inherit;width:3ch;max-width:none;outline:0;caret-color:var(--brass);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.ap input::-webkit-inner-spin-button,.ap input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sl{width:100%;height:36px;margin:0;padding:0;border:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer;--p:10%}
.sl::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--brass) var(--p),rgba(255,255,255,.12) var(--p))}
.sl::-moz-range-track{height:8px;border-radius:8px;background:rgba(255,255,255,.12)}
.sl::-moz-range-progress{height:8px;border-radius:8px;background:var(--brass)}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-12px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 12px rgba(0,0,0,.5),0 0 0 6px rgba(201,164,92,.25)}
.sl::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 12px rgba(0,0,0,.5),0 0 0 6px rgba(201,164,92,.25)}
.se{display:flex;justify-content:space-between;font-size:12px;opacity:.5;margin-top:2px}
.cta{width:100%;margin-top:16px;font-size:17px;padding:18px;border-radius:16px}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12px}
.ft span{opacity:.6}
dialog.sheet{margin:auto auto 0;width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@media(min-width:600px){dialog.sheet{margin:auto;border-radius:26px}}
.burger{background:rgba(10,16,24,.72);border:1px solid rgba(255,255,255,.12);border-radius:12px;width:40px;height:38px;display:grid;place-items:center;padding:0}
.mn{display:flex;flex-direction:column;margin-top:20px;background:rgba(255,255,255,.05);border-radius:14px;overflow:hidden}
.mn button{background:none;border:0;padding:17px 18px;text-align:left;font-weight:600;font-size:16px}
.mn button+button{border-top:1px solid rgba(255,255,255,.06)}
.mn.s{margin-top:10px}.mn.s button{opacity:.7}
@media(prefers-reduced-motion:reduce){.msg,.gift{animation:none}}

:root{--muted:#a3aea7;--line:rgba(232,226,212,.12);--green:#9ec5a6;color-scheme:dark}
body{user-select:auto;background:radial-gradient(110% 70% at 50% 0,#1e3337,#0a1117 75%)}
button{touch-action:manipulation}button svg{pointer-events:none}button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{padding:18px 14px 145px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.wordmark{font-size:13px;text-transform:uppercase;letter-spacing:3px;font-weight:700}.status-tag{font-size:10px;color:#c0c8be;border:1px solid var(--line);padding:6px 9px;border-radius:20px;letter-spacing:.15px}
.pill{min-height:54px;padding:5px 5px 5px 12px;gap:7px}.pill.big{font-size:19px}.balance-copy small{display:block;font-size:9px;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:1px}.balance-copy strong{font-size:19px;font-weight:600;white-space:nowrap}.gold-amount{display:flex;align-items:center;gap:6px}.balance-action{width:38px;height:38px}.burger{height:44px}.island-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:24px 0 12px}.island-heading h1{font-family:Georgia,serif;font-size:30px;font-weight:400;margin:0}.island-heading p{color:var(--muted);font-size:12px;margin:6px 0 0}.tiny-button{background:none;color:var(--muted);border:0;padding:8px;font-size:12px}
.goal-banner{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025);padding:12px 14px;width:100%;text-align:left}.goal-copy{flex:1;min-width:0}.goal-banner strong{font-size:12px;font-weight:600;display:block}.goal-banner small{color:var(--muted);display:block;font-size:11px;margin-top:5px}.progress{background:rgba(255,255,255,.1);height:5px;border-radius:5px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--brass);border-radius:inherit;transition:width .5s}.goal-number{font-size:12px;color:var(--green);white-space:nowrap}
#cv{border-radius:17px;margin-top:12px;touch-action:manipulation}.visit-banner{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:#273948;border-radius:12px;margin-top:12px;font-size:12px}.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.dock button{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:13px 4px;color:#c8d1c6;font-size:11px;display:flex;gap:6px;align-items:center;justify-content:center}.dock button:hover{background:rgba(255,255,255,.08)}.service-note{font-size:11px;text-align:center;color:var(--muted);line-height:1.6;margin:14px 4px 0}.bottom{z-index:3}.msg{animation:none;max-width:500px;line-height:1.5;font-size:12px}#sel small{display:block;margin-top:4px}
.auth{max-width:430px;margin:7vh auto 0;padding:28px 24px}.auth .emblem{display:block;margin:0 auto 24px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--brass);font-weight:600}.auth h1{font-family:Georgia,serif;font-size:58px;font-weight:400;letter-spacing:-2px}.auth p{font-size:14px;line-height:1.8;color:#b3beb5;margin:14px 0 28px}.auth .status-tag{display:inline-block;margin-top:18px}.b{min-height:44px}.b.full{width:100%}.err:empty{display:none}
dialog{max-height:90dvh;overflow-y:auto;padding:26px;border-radius:22px}dialog::backdrop{backdrop-filter:blur(5px)}dialog h2{font-family:Georgia,serif;font-size:27px;font-weight:400;margin:4px 26px 12px 0;text-align:left}dialog h3{font-size:14px;margin:0 0 7px}dialog p{font-size:13px;line-height:1.7;color:#b9c3bb}.sub{font-size:12px!important;color:var(--muted)!important}.row{align-items:center;gap:10px}.stack{display:grid;gap:10px;margin-top:18px}.field{display:block;margin-top:16px}.field span{display:block;font-size:12px;margin-bottom:7px;color:#bcc8bd}.field input{width:100%;font-size:16px}input[type=file]{width:100%;font-size:12px}.opt canvas{width:80px;height:70px}.opt .copy{flex:1;min-width:0}.opt small{display:block;color:var(--muted);font-size:11px;line-height:1.6}.opt b{font-size:14px;display:block;margin-bottom:4px}.opt .b{padding:9px 11px;font-size:12px}.card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:13px;padding:15px;margin-top:12px}.card p{margin:6px 0 0;font-size:12px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.summary-grid .card{margin:0}.summary-grid small{display:block;font-size:10px;color:var(--muted);margin-bottom:7px}.summary-grid strong{font-size:23px;font-weight:600}.receipt{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.receipt small{color:var(--muted);display:block;margin-top:4px}.menu-list{display:grid;gap:8px;margin-top:18px}.menu-list button{text-align:left;justify-content:flex-start}.choice{display:block;width:100%;text-align:left;line-height:1.5;padding:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;margin-top:9px;font-size:13px}.choice:hover{border-color:var(--brass)}.theme-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.theme-option{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:12px;padding:12px 5px;font-size:11px}.theme-option[aria-pressed=true]{border-color:var(--brass);color:var(--brass)}.theme-swatch{height:40px;margin:0 5px 8px;border-radius:7px;background:linear-gradient(145deg,#567b60,#132e38)}.theme-swatch.coast{background:linear-gradient(145deg,#97a274,#27556b)}.theme-swatch.night{background:linear-gradient(145deg,#68739d,#17243e)}.reward-amount{font-family:Georgia,serif;font-size:65px;text-align:center;color:#f1d49c;margin:20px 0 10px}.celebration{text-align:center}.celebration h2{margin:10px 0}.celebration .eyebrow{margin-top:15px}.celebration .sigil{font-size:40px;color:var(--brass);margin-top:10px}
.ap{font-size:clamp(38px,14vw,68px)}.ap input{max-width:calc(100% - 1ch)}
@media(min-width:600px){.wrap{padding-top:24px}.island-heading h1{font-size:36px}.dock button{padding:15px;font-size:12px}}@media(max-width:360px){.balance-copy strong{font-size:16px}.pill.balance{padding-left:8px;gap:5px}.balance-action{width:32px}.dock button{font-size:10px}.wrap{padding-left:10px;padding-right:10px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<main class="auth" id="login">
  <svg class="emblem" width="94" height="94" viewBox="0 0 94 94" fill="none" aria-hidden="true"><path d="M47 8 83 29v36L47 86 11 65V29z" fill="#c9a45c" fill-opacity=".07" stroke="#c9a45c"/><path d="m27 51 20-12 20 12-20 12z" fill="#58785c"/><path d="M38 47V34l9-6 10 6v13l-10 6z" fill="#b1a085"/><path d="m35 35 12-14 13 14-13-6z" fill="#98694c"/><path d="M47 42v10" stroke="#5d4934" stroke-width="5"/></svg>
  <span class="eyebrow">A place for your plans</span><h1>Holdfast</h1>
  <p>Build a little island.<br>Make room for your goals.</p>
  <button class="b g" data-a="begin">Start your island <span aria-hidden="true">↗</span></button>
  <span class="status-tag">Your island, at your pace</span><p class="sub">Your first cabin is on us. No deposit needed.</p>
</main>
<main class="wrap" id="game" hidden>
  <div class="brand"><span class="wordmark">Holdfast</span><span class="status-tag">Your island, at your pace</span></div>
  <div class="top">
    <div class="pill big balance"><div class="balance-copy"><small>Savings</small><strong>£<span id="sv">—</span></strong></div><button class="balance-action add" data-a="dep" aria-label="Deposit" title="Deposit"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <div class="pill balance"><div class="balance-copy"><small>Game gold</small><strong class="gold-amount"><i class="coin" aria-hidden="true"></i><span id="coins">100</span></strong></div><button class="balance-action" data-a="shop" aria-label="Shop" title="Shop"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v10h16V10M3 6l2-3h14l2 3v4a3 3 0 0 1-6 0 3 3 0 0 1-6 0V6zM9 20v-6h6v6M3 6h18"/></svg></button></div>
    <div class="sp"></div><button class="chip" id="cancel" data-a="pcancel" hidden>Cancel</button><button class="burger" data-a="menu" aria-label="Menu" title="Menu"><svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 5h14M2 9h14M2 13h14"/></svg></button>
  </div>
  <div class="island-heading"><div><h1 id="island-name">My island</h1><p id="island-caption">A little more yours, every day.</p></div><button class="tiny-button" data-a="profile" aria-label="Edit island name">Rename ↗</button></div>
  <button class="goal-banner" data-a="goal"><div class="goal-copy"><strong id="goal-name">What are you making room for?</strong><small id="goal-copy">Choose a savings goal, at your own pace.</small><div class="progress" id="goal-progress" hidden><i id="goal-fill"></i></div></div><span class="goal-number" id="goal-number">Set a goal ↗</span></button>
  <div class="visit-banner" id="visit-banner" hidden><span id="visit-name"></span><button class="b" data-a="leave-visit">Back to my island</button></div>
  <canvas id="cv" width="800" height="560" aria-label="Your island. Select buildings to inspect them; choose Shop to add a building."></canvas>
  <nav class="dock" aria-label="Island activities"><button data-a="goal">◎ <span>Your goal</span></button><button data-a="learn">◇ <span>Learn</span></button><button data-a="design">✧ <span>Decorate</span></button><button data-a="postcards">↗ <span>Visit islands</span></button></nav>
  <p class="service-note" id="service-note" role="status">Connecting your wallet…</p>
</main>
<div class="bottom" id="bot" hidden><div class="msg" id="msg" hidden></div><div id="sel" hidden><div class="t"><b id="sn"></b><small id="si"></small></div><button class="b g" id="su" data-a="selu"></button></div></div>
<dialog id="dlg" aria-labelledby="dialog-title"></dialog><div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;text-align:center">Please enable JavaScript to build your island.</p></noscript>
<script type="module" src="./app.mjs"></script>
</body>
</html>
